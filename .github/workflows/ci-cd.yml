name: CI/CD

# --- What this pipeline does -------------------------------------------
# 1. `test`             — runs the full Django test suite on every push and
#                          pull request. Nothing downstream runs if this fails.
# 2. `build-frontend`   — builds the Svelte app and uploads the compiled
#                          output as a workflow artifact. Runs on every push
#                          and PR too, so a broken frontend build is caught
#                          before merge, not after deploy.
# 3. `publish-deploy`   — only on a push to `main`, and only once tests +
#                          build both succeed: bakes the compiled frontend
#                          into `backend/frontend_dist/` and pushes the
#                          whole result to a `deploy` branch.
#
# Why a `deploy` branch instead of deploying directly: PythonAnywhere's free
# tier has no SSH access, so GitHub Actions cannot reach into the server to
# run anything. The `deploy` branch is a fully self-contained snapshot —
# backend code *and* the pre-built frontend — that PythonAnywhere can pull
# with a plain `git pull` and run with zero npm/node needed server-side.
# See deploy/ci-cd.md for how the PythonAnywhere side of this is wired up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Run backend test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django test suite
        working-directory: backend
        env:
          DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: python manage.py test customers

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Verify built asset paths (catches the /static/ prefix regression)
        working-directory: frontend
        run: |
          if ! grep -q '/static/assets/' dist/index.html; then
            echo "::error::Built index.html does not reference /static/assets/ — check vite.config.js's base path."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  publish-deploy:
    name: Publish deploy branch
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist-downloaded

      - name: Bake the build into backend/frontend_dist
        run: |
          rm -rf backend/frontend_dist
          mkdir -p backend/frontend_dist
          cp -r frontend-dist-downloaded/* backend/frontend_dist/

      - name: Commit and push the deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy
          git add -f backend/frontend_dist
          git commit -m "deploy: ${{ github.sha }}" --allow-empty
          git push origin deploy --force
