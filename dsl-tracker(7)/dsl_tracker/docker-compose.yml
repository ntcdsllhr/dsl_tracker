# Optional: run a local MySQL instance matching PythonAnywhere's free tier,
# instead of the SQLite default. Not required — the app works fine on
# SQLite for dev.
#
# Usage:
#   docker compose up -d
#   Then set in backend/.env:
#     DATABASE_URL=mysql://dsltracker:dsltracker@localhost:3306/dsltracker
#   python manage.py migrate

version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dsltracker
      MYSQL_USER: dsltracker
      MYSQL_PASSWORD: dsltracker
      MYSQL_ROOT_PASSWORD: dsltracker_root
    ports:
      - "3306:3306"
    volumes:
      - dsltracker_mysqldata:/var/lib/mysql

volumes:
  dsltracker_mysqldata:
